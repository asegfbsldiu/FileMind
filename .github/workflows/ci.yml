name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要验证目标；Linux 与 macOS 用来覆盖跨平台回退路径。
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # 界面文案、断言消息和测试数据都是中文；强制 UTF-8 避免在 cp1252 区域报 UnicodeEncodeError。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 下 Qt 离屏运行所需的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 依赖一致性检查
        run: python -m pip check

      - name: 编译检查
        run: python -m compileall -q main.py filemind tests tools

      - name: 运行测试
        shell: pwsh
        run: |
          $output = python -m pytest -q --tb=short -rf --durations=10 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'pytest-output.txt') -Encoding utf8
          Write-Output $output
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @(
              '## pytest 失败输出', '', '```text', $output, '```')
            $lines = Get-Content -Path (Join-Path $env:RUNNER_TEMP 'pytest-output.txt')
            foreach ($line in ($lines | Where-Object { $_ -match '^(FAILED|ERROR) ' } | Select-Object -First 30)) {
              Write-Output ("::error title=pytest::{0}" -f ($line -replace '%', '%25'))
            }
            foreach ($line in ($lines | Select-Object -Last 30)) {
              $message = ($line -replace '%', '%25').TrimEnd()
              if (-not $message) { $message = '-' }
              Write-Output ("::error title=pytest-tail::{0}" -f $message)
            }
            Write-Error "pytest 失败，退出码 $code"
          } else {
            $lines = Get-Content -Path (Join-Path $env:RUNNER_TEMP 'pytest-output.txt')
            $summary = ($lines | Where-Object { $_.Trim() } | Select-Object -Last 1)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value ("pytest 全部通过：" + $summary)
            Write-Output ("::notice title=pytest::{0}" -f ($summary -replace '%', '%25'))
          }
          exit $code

      - name: 校验打包元数据与入口点
        run: |
          python -m pip install --no-deps -e .
          python -c "import importlib.metadata as m; d = m.metadata('filemind'); print(d['Name'], d['Version'], d['Requires-Python'])"
          python -m pip wheel . --no-deps --wheel-dir dist
          python -c "from pathlib import Path; from zipfile import ZipFile; p=next(Path('dist').glob('filemind-*.whl')); z=ZipFile(p); required={'filemind/ui/styles/orbit.qss','filemind/ui/assets/deepseek-logo.png','filemind/ui/widgets/combo_box.py','filemind/models/__init__.py'}; assert required.issubset(z.namelist()), required-set(z.namelist()); assert not any(Path(n).name.startswith('.env') or 'local_api_keys' in n for n in z.namelist()); print('Wheel resources verified')"
