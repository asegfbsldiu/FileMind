name: Windows Release

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create a draft Release (select a matching vX.Y.Z tag)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-*.lock

      - name: Validate version and requested tag
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          DRAFT_REQUESTED: ${{ inputs.create_draft_release }}
        run: |
          $version = python tools/windows_release.py version
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read application version.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne "v$version") {
            throw 'Tag and filemind/__init__.py version do not match.'
          }
          if ($env:DRAFT_REQUESTED -eq 'true' -and $env:RELEASE_REF_TYPE -ne 'tag') {
            throw 'Select a vX.Y.Z tag to create a draft Release.'
          }

      - name: Prepare pinned environment and version resources
        run: |
          python -m venv .venv-build
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create build environment.' }
          ./scripts/build-windows.ps1 -Stage Prepare

      - name: Run focused release configuration tests
        run: |
          ./.venv-build/Scripts/python.exe -m pytest tests/test_windows_release.py tests/test_installer_wizard.py tests/test_app_icon.py -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Release configuration tests failed.' }

      - name: Install Inno Setup compiler if needed
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Build onedir app and check frozen dependencies
        run: ./scripts/build-windows.ps1 -Stage Bundle

      - name: Compile installer and assemble release artifacts
        run: ./scripts/build-windows.ps1 -Stage Installer

      - name: Upload distributable files
        uses: actions/upload-artifact@v7
        with:
          name: FileMind-windows-x64
          path: dist/release/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FileMind-build-diagnostics
          path: |
            build/release/*.json
            build/release/THIRD_PARTY_NOTICES.txt
            build/pyinstaller/FileMind/warn-FileMind.txt
          if-no-files-found: ignore
          retention-days: 14

  draft-release:
    needs: build
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.create_draft_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FileMind-windows-x64
          path: release-assets
      - name: Create or update a draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo 'The Release is already published; its files will not be replaced.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag \
              --title "FileMind ${RELEASE_TAG#v}" --generate-notes
          fi
