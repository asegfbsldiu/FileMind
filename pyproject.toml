[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filemind"
description = "Local desktop file organization, reviewed AI suggestions, and safe undo."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "FileMind contributors"}]
dynamic = ["version", "dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment :: File Managers",
]

[project.gui-scripts]
filemind = "filemind.ui.main_window:main"

[tool.setuptools.dynamic]
version = {attr = "filemind.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["filemind*"]

[tool.setuptools.package-data]
"filemind.ui" = ["assets/*", "assets/provider_logos/*.png", "styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
